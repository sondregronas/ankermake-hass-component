name: Release-Dev

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hacs:
    name: HACS Action
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Compute next dev tag
        run: |
          latest_release=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          next_version=$(echo "$latest_release" | awk -F. '{print $1"."$2+1".0"}')
          last_dev=$(git tag --list "${next_version}-*" | sort -V | tail -n1)
          if [[ -z "$last_dev" ]]; then
            tag="${next_version}-0"
          else
            n=${last_dev#"${next_version}-"}
            tag="${next_version}-$((n+1))"
          fi
          echo "tag=$tag" >> $GITHUB_ENV

      - name: Go to the dev branch
        run: git checkout dev

      - name: Set version to release tag
        run: |
          sed -i "s/GITHUB_RELEASE_VERSION/${{ env.tag }}/g" custom_components/ankermake/manifest.json
          sed -i "s/GITHUB_RELEASE_VERSION/${{ env.tag }}/g" custom_components/ankermake/const.py

      - name: Zip ankermake
        run: |
          cd custom_components/ankermake
          zip -r ankermake.zip .

      - name: Upload release asset to the existing release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: custom_components/ankermake/ankermake.zip
          asset_name: ankermake.zip
          tag: ${{ env.tag }}
          overwrite: true
          body: "Autogenerated prerelease (dev) version of the component. See the GitHub repository for details."
          prerelease: true
          target_commit: dev
